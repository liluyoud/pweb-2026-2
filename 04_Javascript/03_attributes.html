<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atributos de Elementos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    section {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px 20px;
      margin-bottom: 20px;
    }

    button {
      margin-top: 10px;
      padding: 8px 14px;
      cursor: pointer;
    }

    #resultado {
      margin-top: 10px;
      font-weight: bold;
      color: darkgreen;
    }
  </style>
</head>

<body>

  <h1>Acessando e Alterando Atributos</h1>

  <!-- element.attribute -->
  <section>
    <h2>1. element.attribute</h2>
    <a id="link" href="https://www.w3schools.com" target="_self">Link de exemplo</a>
    <br>
    <button type="button" onclick="lerAtributoHref()">Ler atributo href</button>
    <button type="button" onclick="mudarAtributoHref()">Mudar href diretamente</button>
  </section>

  <!-- element.style.property -->
  <section>
    <h2>2. element.style.property</h2>
    <p id="paragrafoEstilo">Este parágrafo terá seu estilo alterado.</p>
    <button type="button" onclick="mudarEstilo()">Mudar estilo (cor, fundo, tamanho)</button>
  </section>

  <!-- setAttribute -->
  <section>
    <h2>3. element.setAttribute()</h2>
    <img id="imagem" src="https://placehold.co/120" alt="Imagem inicial" width="120">
    <br>
    <button type="button" onclick="mudarSrcComSetAttribute()">setAttribute("src", ...)</button>
    <button type="button" onclick="criarAtributoNovo()">Criar novo atributo (title)</button>
  </section>

  <!-- getAttribute -->
  <section>
    <h2>4. element.getAttribute()</h2>
    <input id="campo" type="text" placeholder="Digite algo" maxlength="10">
    <br>
    <button type="button" onclick="lerAtributoMaxlength()">Ler atributo maxlength</button>
  </section>

  <div id="resultado">Resultado aparecerá aqui...</div>

  <script>
    function mostrarResultado(texto) {
      document.getElementById("resultado").innerHTML = texto;
    }

    // 1. Acessando atributo com element.attribute
    function lerAtributoHref() {
      const link = document.getElementById("link");
      mostrarResultado("O valor atual do href é: " + link.href);
    }

    function mudarAtributoHref() {
      const link = document.getElementById("link");
      link.href = "https://developer.mozilla.org";
      mostrarResultado("O href foi alterado diretamente via element.attribute.");
    }

    // 2. element.style.property
    function mudarEstilo() {
      const paragrafo = document.getElementById("paragrafoEstilo");
      paragrafo.style.color = "white";
      paragrafo.style.backgroundColor = "purple";
      paragrafo.style.fontSize = "20px";
      paragrafo.style.padding = "10px";
      mostrarResultado("O estilo do parágrafo foi alterado via element.style.property.");
    }

    // 3. setAttribute
    function mudarSrcComSetAttribute() {
      const imagem = document.getElementById("imagem");
      imagem.setAttribute("src", "https://placehold.co/120/orange/ffffff");
      mostrarResultado("O atributo 'src' foi alterado usando setAttribute().");
    }

    function criarAtributoNovo() {
      const imagem = document.getElementById("imagem");
      imagem.setAttribute("title", "Imagem criada com setAttribute!");
      mostrarResultado("Um novo atributo 'title' foi criado. Passe o mouse sobre a imagem para ver.");
    }

    // 4. getAttribute
    function lerAtributoMaxlength() {
      const campo = document.getElementById("campo");
      const valor = campo.getAttribute("maxlength");
      mostrarResultado("O atributo 'maxlength' do campo é: " + valor);
    }
  </script>

</body>

</html>

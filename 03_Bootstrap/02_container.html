<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="container">
        <h1>Minha Primeira Página com Bootstrap</h1>
        <p>Esta parte está dentro de uma classe .container.</p>
        <p>A classe .container fornece um container responsivo de largura fixa.</p>
        <p>Redimensione a janela do navegador para ver que a largura do container muda em diferentes breakpoints.</p>
    </div>

</body>

</html>
